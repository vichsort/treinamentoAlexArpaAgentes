name: native-agents

# Roda sempre da main confiável. Nunca faz checkout nem executa código de PR.
on:
  issues:
    types: [opened, labeled]
  pull_request_target:
    types: [opened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      issue:
        description: Número da issue origin:app a retomar
        required: true

permissions:
  issues: write
  pull-requests: read
  contents: read

concurrency:
  group: native-agents-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  controlar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: node automacao/controlador.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          AGENT_RUNTIME: ${{ vars.AGENT_RUNTIME }}
          AGENT_DRY_RUN: ${{ vars.AGENT_DRY_RUN || 'true' }}
          INPUT_ISSUE: ${{ inputs.issue }}
