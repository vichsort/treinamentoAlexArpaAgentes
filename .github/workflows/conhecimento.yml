name: conhecimento

# Cada PR integrado e cada issue fechada viram uma entrada em docs/knowledge (consultada pelos agentes antes de trabalhar).
# pull_request_target roda o código da main, nunca o do PR: o PR entra só como dado lido pela API.
on:
  pull_request_target:
    types: [closed]
  issues:
    types: [closed]

permissions:
  contents: write
  pull-requests: read
  issues: read

# Uma geração por vez: todas escrevem o mesmo INDEX.md.
concurrency:
  group: conhecimento
  cancel-in-progress: false

jobs:
  registrar:
    if: github.event_name == 'issues' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gera a entrada
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TIPO: ${{ github.event_name == 'issues' && 'issue' || 'pr' }}
          NUMERO: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: node automacao/conhecimento.mjs "$TIPO" "$NUMERO"
      - name: Grava na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/knowledge
          git diff --cached --quiet && { echo "Nada novo."; exit 0; }
          git commit -m "Conhecimento: ${{ github.event_name == 'issues' && 'issue' || 'PR' }} #${{ github.event.issue.number || github.event.pull_request.number }}"
          for i in 1 2 3; do git pull --rebase -q origin "${{ github.event.repository.default_branch }}" && git push -q && exit 0; sleep 3; done
          echo "Não consegui gravar na main."; exit 1
