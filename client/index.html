<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EDF3FA" />
    <meta name="description" content="Fluxo: quadros, listas e cartões para organizar o trabalho." />
    <script>
      // aplica o tema antes da primeira pintura, para não piscar o claro
      try {
        var t = localStorage.getItem("fluxo-tema");
        if (t !== "claro" && t !== "escuro") t = matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
        document.documentElement.dataset.tema = t;
        if (t === "escuro") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0f1722");
      } catch (e) {}
    </script>
    <title>Fluxo — quadro de tarefas</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
